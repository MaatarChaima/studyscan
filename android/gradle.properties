# PC avec 8 Go de RAM : 8 Go pour Gradle saturait la mémoire (compilation très lente)
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Projet sur D:\ et cache Flutter sur C:\ : la compilation Kotlin incrémentale échoue
# ("different roots"). On la désactive pour éviter ces erreurs.
kotlin.incremental=false
